name: End-to-end tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # toda segunda-feira, 8h (horário de Brasília): avisa se algo quebrar sem mudança no código
    - cron: "0 11 * * 1"

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Instala as dependências (com cache) e roda todos os testes Cypress
      - name: Cypress run
        uses: cypress-io/github-action@v7

      - name: Screenshots das falhas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
